<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1180" width="360" height="1180" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="12" fill="#222">
  <title id="title">Mobile wireframe, 360 pixels wide</title>
  <desc id="desc">One column. Header with title and wrapping navigation, then About, four stacked stat cards, the 7 day chart, search, record cards, the add form and settings.</desc>
  <rect width="360" height="1180" fill="#fff" stroke="#222"/>
  <rect x="0" y="0" width="360" height="84" fill="#e6e6e6" stroke="#222"/>
  <text x="16" y="28" font-size="15" font-weight="bold">Student Finance Tracker</text>
  <text x="290" y="28">Theme</text>
  <text x="16" y="62">About   Dashboard   Records   Add   Settings</text>
  <text x="16" y="110" font-weight="bold">About</text>
  <rect x="16" y="120" width="328" height="56" fill="none" stroke="#777"/>
  <text x="26" y="152">Purpose, GitHub link, email</text>
  <text x="16" y="204" font-weight="bold">Dashboard</text>
  <rect x="16" y="214" width="328" height="44" fill="none" stroke="#777"/>
  <text x="26" y="241">Total records</text>
  <rect x="16" y="266" width="328" height="44" fill="none" stroke="#777"/>
  <text x="26" y="293">Total spent</text>
  <rect x="16" y="318" width="328" height="44" fill="none" stroke="#777"/>
  <text x="26" y="345">Top category</text>
  <rect x="16" y="370" width="328" height="44" fill="none" stroke="#777"/>
  <text x="26" y="397">Budget: remaining or over</text>
  <rect x="16" y="422" width="328" height="120" fill="none" stroke="#777"/>
  <text x="26" y="442">Last 7 days</text>
  <rect x="34" y="490" width="28" height="36" fill="#999"/>
  <rect x="78" y="470" width="28" height="56" fill="#999"/>
  <rect x="122" y="500" width="28" height="26" fill="#999"/>
  <rect x="166" y="460" width="28" height="66" fill="#999"/>
  <rect x="210" y="510" width="28" height="16" fill="#999"/>
  <rect x="254" y="480" width="28" height="46" fill="#999"/>
  <rect x="298" y="495" width="28" height="31" fill="#999"/>
  <text x="16" y="572" font-weight="bold">Records</text>
  <rect x="16" y="582" width="328" height="34" fill="none" stroke="#222"/>
  <text x="26" y="604">Regex search</text>
  <text x="16" y="636">[x] Ignore case     Sort by [Newest first]</text>
  <text x="16" y="658">Hints: cents, beverage, duplicate word</text>
  <rect x="16" y="670" width="328" height="86" fill="none" stroke="#777"/>
  <text x="26" y="692" font-weight="bold">Lunch at the cafeteria</text>
  <text x="26" y="712">2025-09-29   Food   USD 4.50</text>
  <text x="26" y="742">[Edit] [Delete]</text>
  <rect x="16" y="764" width="328" height="86" fill="none" stroke="#777"/>
  <text x="26" y="786" font-weight="bold">Record card</text>
  <text x="26" y="836">[Edit] [Delete]</text>
  <text x="16" y="880" font-weight="bold">Add a record</text>
  <rect x="16" y="890" width="328" height="30" fill="none" stroke="#222"/>
  <text x="26" y="910">Description</text>
  <rect x="16" y="926" width="328" height="30" fill="none" stroke="#222"/>
  <text x="26" y="946">Amount</text>
  <rect x="16" y="962" width="328" height="30" fill="none" stroke="#222"/>
  <text x="26" y="982">Category</text>
  <rect x="16" y="998" width="328" height="30" fill="none" stroke="#222"/>
  <text x="26" y="1018">Date</text>
  <rect x="16" y="1036" width="120" height="30" fill="#ccc" stroke="#222"/>
  <text x="38" y="1056">Add record</text>
  <text x="16" y="1096" font-weight="bold">Settings</text>
  <rect x="16" y="1106" width="328" height="30" fill="none" stroke="#777"/>
  <text x="26" y="1126">Currencies, budget cap, categories, data (stacked)</text>
  <text x="16" y="1164">Footer: name, GitHub, email</text>
</svg>
