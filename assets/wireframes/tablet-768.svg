<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 900" width="768" height="900" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif" font-size="13" fill="#222">
  <title id="title">Tablet wireframe, 768 pixels wide</title>
  <desc id="desc">Header on one row. Stat cards two by two. Records become a table with sortable headers. The add form uses two columns and settings panels sit two by two.</desc>
