  <rect x="390" y="180" width="354" height="50" fill="none" stroke="#777"/>
  <text x="402" y="210">Total spent</text>
  <rect x="24" y="238" width="354" height="50" fill="none" stroke="#777"/>
  <text x="36" y="268">Top category</text>
