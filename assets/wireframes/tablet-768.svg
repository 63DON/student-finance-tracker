  <rect x="0" y="0" width="768" height="56" fill="#e6e6e6" stroke="#222"/>
  <text x="24" y="34" font-size="16" font-weight="bold">Student Finance Tracker</text>
  <text x="330" y="34">About   Dashboard   Records   Add   Settings   Theme</text>
  <text x="24" y="86" font-weight="bold">About</text>
  <rect x="24" y="96" width="720" height="44" fill="none" stroke="#777"/>
  <text x="36" y="123">Purpose, GitHub link, email</text>
  <text x="24" y="170" font-weight="bold">Dashboard</text>
  <rect x="24" y="180" width="354" height="50" fill="none" stroke="#777"/>
