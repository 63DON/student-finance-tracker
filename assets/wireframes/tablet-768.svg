  <text x="510" y="539">Amount (sort)</text>
  <text x="640" y="539">Actions</text>
  <rect x="24" y="548" width="720" height="28" fill="none" stroke="#777"/>
  <text x="36" y="567">2025-09-29</text>
  <text x="150" y="567">Lunch at the cafeteria</text>
  <text x="400" y="567">Food</text>
  <text x="510" y="567">USD 4.50</text>
  <text x="640" y="567">[Edit] [Delete]</text>
  <rect x="24" y="576" width="720" height="28" fill="none" stroke="#777"/>
  <rect x="24" y="604" width="720" height="28" fill="none" stroke="#777"/>
