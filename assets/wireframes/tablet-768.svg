  <text x="36" y="318">Last 7 days</text>
  <rect x="70" y="360" width="60" height="40" fill="#999"/>
  <rect x="166" y="340" width="60" height="60" fill="#999"/>
  <rect x="262" y="372" width="60" height="28" fill="#999"/>
  <rect x="358" y="330" width="60" height="70" fill="#999"/>
  <rect x="454" y="384" width="60" height="16" fill="#999"/>
  <rect x="550" y="352" width="60" height="48" fill="#999"/>
  <rect x="646" y="366" width="60" height="34" fill="#999"/>
  <text x="24" y="446" font-weight="bold">Records</text>
  <rect x="24" y="456" width="460" height="32" fill="none" stroke="#222"/>
  <text x="36" y="477">Regex search</text>
